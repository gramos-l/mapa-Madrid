<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Madrid 3D</title>
<link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.css">
<style>
  :root {
    --bg: #eeece6;
    --panel: rgba(255,255,255,.88);
    --ink: #1c2330;
    --muted: #68707e;
    --line: rgba(28,35,48,.12);
    --accent: #2f5bea;
  }
  :root[data-theme="dark"] {
    --bg: #171c25;
    --panel: rgba(24,29,38,.88);
    --ink: #eef1f6;
    --muted: #98a1b0;
    --line: rgba(255,255,255,.14);
    --accent: #7ea2ff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #map { position: absolute; inset: 0; }

  .panel { position: absolute; background: var(--panel); border: 1px solid var(--line);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-radius: 14px; }

  #hud { top: calc(12px + env(safe-area-inset-top, 0px)); left: 12px; padding: 12px 14px; min-width: 190px; z-index: 2; }
  #hud h1 { margin: 0 0 6px; font-size: 17px; font-weight: 650; letter-spacing: -.01em; }
  #mode { display: inline-block; padding: 2px 9px; border-radius: 99px; font-weight: 600; font-size: 12px;
    background: var(--line); color: var(--muted); transition: background .25s, color .25s; }
  #mode.is3d { background: var(--accent); color: #fff; }
  #stats { margin-top: 8px; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12.5px; }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 13px; }
  .row label { display: flex; align-items: center; gap: 7px; cursor: pointer; }
  input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
  button { font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--line);
    border-radius: 99px; padding: 6px 12px; cursor: pointer; white-space: nowrap; }
  button:hover { border-color: var(--accent); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  #legend { top: calc(12px + env(safe-area-inset-top, 0px)); right: 56px; padding: 10px 12px; font-size: 12px; z-index: 2; }
  #legend .bar { height: 8px; width: 120px; border-radius: 4px; margin: 6px 0 3px;
    background: linear-gradient(90deg, #dfe3ea, #b9c6e8, #7f9be0, #4a63c7, #2b2f7a); }
  :root[data-theme="dark"] #legend .bar { background: linear-gradient(90deg, #3a4150, #4b5a86, #5f7bd0, #8fa8ff, #d6e0ff); }
  #legend .ticks { display: flex; justify-content: space-between; color: var(--muted); }

  #places { left: 0; right: 0; bottom: 0; border-radius: 16px 16px 0 0; border-bottom: 0; z-index: 2;
    padding: 10px 12px calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; overflow-x: auto;
    scrollbar-width: none; }
  #places::-webkit-scrollbar { display: none; }
  #places button { flex: none; }

  #busy { left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px));
    padding: 6px 14px; font-size: 13px; z-index: 2; opacity: 0; pointer-events: none; transition: opacity .2s; }
  #busy.on { opacity: 1; }

  #msg { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); padding: 14px 18px;
    max-width: 320px; text-align: center; display: none; z-index: 3; }

  .maplibregl-ctrl-attrib { font-size: 10px; }
  @media (max-width: 520px) { #legend { display: none; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="map"></div>

<div id="hud" class="panel">
  <h1>Madrid</h1>
  <span id="mode">2D</span>
  <div id="stats">zoom 12.0 · inclinación 0°</div>
  <div class="row">
    <label><input type="checkbox" id="auto" checked> Inclinar al acercar</label>
  </div>
  <div class="row">
    <button id="theme" type="button">Modo oscuro</button>
    <button id="reset" type="button">Vista general</button>
  </div>
</div>

<div id="legend" class="panel">
  Altura del edificio
  <div class="bar"></div>
  <div class="ticks"><span>0</span><span>40</span><span>100</span><span>150+ m</span></div>
</div>

<div id="busy" class="panel">Cargando edificios…</div>
<div id="places" class="panel" role="group" aria-label="Lugares de Madrid"></div>
<div id="msg" class="panel"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js"></script>
<script>
(function () {
  const MADRID = { center: [-3.7038, 40.4168], zoom: 12, pitch: 0, bearing: 0 };
  const BOUNDS = [[-3.95, 40.25], [-3.45, 40.62]];   // solo se descargan teselas de Madrid

  const PLACES = [
    { name: 'Puerta del Sol',     c: [-3.7038, 40.4169], z: 17.2, b: 20 },
    { name: 'Gran Vía',           c: [-3.7055, 40.4200], z: 17.0, b: -30 },
    { name: 'Plaza de España',    c: [-3.7122, 40.4234], z: 17.2, b: 160 },
    { name: 'Palacio Real',       c: [-3.7143, 40.4179], z: 17.0, b: -20 },
    { name: 'Retiro',             c: [-3.6844, 40.4153], z: 16.4, b: 0 },
    { name: 'Atocha',             c: [-3.6893, 40.4065], z: 16.8, b: 40 },
    { name: 'Bernabéu',           c: [-3.6883, 40.4531], z: 17.0, b: -50 },
    { name: 'Cuatro Torres',      c: [-3.6903, 40.4780], z: 16.6, b: 200 }
  ];

  // El 3D empieza más cerca: así solo se construyen los edificios de la zona que ves
  const EXTRUDE_FROM = 15;     // zoom en el que aparecen los volúmenes
  const EXTRUDE_FULL = 16.5;   // zoom con la altura completa
  const MAX_PITCH_AUTO = 55;   // menos inclinación = menos teselas hacia el horizonte
  const FLAT_UNTIL = 14.8;
  const FULL_3D_AT = 16.8;

  let theme = 'light';
  let auto = true;

  /* ---------- Estilo mínimo propio: sin sprites, sin tipografías, solo lo necesario ---------- */
  function makeStyle(t) {
    const dk = t === 'dark';
    const C = dk
      ? { bg: '#171c25', green: '#1d2a25', water: '#0e2236', casing: '#10141a', minor: '#2a3240', major: '#3b4658', motor: '#4c5a72', foot: '#232a36',
          cols: [0, '#3a4150', 40, '#4b5a86', 100, '#5f7bd0', 150, '#8fa8ff', 220, '#d6e0ff'] }
      : { bg: '#eeece6', green: '#d3e4c4', water: '#a9cbea', casing: '#d6d1c5', minor: '#ffffff', major: '#ffffff', motor: '#fbe9c9', foot: '#e0dcd2',
          cols: [0, '#dfe3ea', 40, '#b9c6e8', 100, '#7f9be0', 150, '#4a63c7', 220, '#2b2f7a'] };

    const wd = b => ['interpolate', ['exponential', 1.5], ['zoom'], 10, b * 0.15, 14, b, 18, b * 8];
    const h = ['coalesce', ['get', 'render_height'], 8];
    const minH = ['coalesce', ['get', 'render_min_height'], 0];
    const S = 'ofm';

    return {
      version: 8,
      name: 'madrid-3d',
      sources: { ofm: { type: 'vector', url: 'https://tiles.openfreemap.org/planet' } },
      light: { anchor: 'viewport', position: [1.4, 215, 35], color: dk ? '#9fb0d8' : '#ffffff', intensity: dk ? 0.35 : 0.42 },
      layers: [
        { id: 'fondo', type: 'background', paint: { 'background-color': C.bg } },
        { id: 'cobertura', type: 'fill', source: S, 'source-layer': 'landcover',
          filter: ['in', 'class', 'grass', 'wood', 'scrub'], paint: { 'fill-color': C.green, 'fill-opacity': 0.7 } },
        { id: 'parques', type: 'fill', source: S, 'source-layer': 'park', paint: { 'fill-color': C.green } },
        { id: 'agua', type: 'fill', source: S, 'source-layer': 'water', paint: { 'fill-color': C.water } },
        { id: 'rios', type: 'line', source: S, 'source-layer': 'waterway', minzoom: 11,
          paint: { 'line-color': C.water, 'line-width': wd(1.5) } },
        { id: 'edificios-planos', type: 'fill', source: S, 'source-layer': 'building', minzoom: 13, maxzoom: EXTRUDE_FROM,
          paint: { 'fill-color': C.foot } },
        { id: 'calles-borde', type: 'line', source: S, 'source-layer': 'transportation', minzoom: 10,
          filter: ['in', 'class', 'primary', 'secondary', 'motorway', 'trunk'],
          layout: { 'line-cap': 'round', 'line-join': 'round' },
          paint: { 'line-color': C.casing, 'line-width': wd(3.6) } },
        { id: 'calles-menores', type: 'line', source: S, 'source-layer': 'transportation', minzoom: 12.5,
          filter: ['in', 'class', 'minor', 'tertiary'],
          layout: { 'line-cap': 'round', 'line-join': 'round' },
          paint: { 'line-color': C.minor, 'line-width': wd(1.1) } },
        { id: 'calles-principales', type: 'line', source: S, 'source-layer': 'transportation', minzoom: 10,
          filter: ['in', 'class', 'primary', 'secondary'],
          layout: { 'line-cap': 'round', 'line-join': 'round' },
          paint: { 'line-color': C.major, 'line-width': wd(2.4) } },
        { id: 'autovias', type: 'line', source: S, 'source-layer': 'transportation', minzoom: 9,
          filter: ['in', 'class', 'motorway', 'trunk'],
          layout: { 'line-cap': 'round', 'line-join': 'round' },
          paint: { 'line-color': C.motor, 'line-width': wd(3) } },
        { id: 'edificios-3d', type: 'fill-extrusion', source: S, 'source-layer': 'building', minzoom: EXTRUDE_FROM,
          filter: ['!=', ['get', 'hide_3d'], true],
          paint: {
            // Los edificios "crecen" desde el suelo entre EXTRUDE_FROM y EXTRUDE_FULL
            'fill-extrusion-height': ['interpolate', ['linear'], ['zoom'], EXTRUDE_FROM, 0, EXTRUDE_FULL, h],
            'fill-extrusion-base': ['interpolate', ['linear'], ['zoom'], EXTRUDE_FROM, 0, EXTRUDE_FULL, minH],
            'fill-extrusion-color': ['interpolate', ['linear'], h].concat(C.cols),
            // Opacidad 1 y sin degradado: con transparencia el móvil dibuja los edificios en dos pasadas
            'fill-extrusion-opacity': 1,
            'fill-extrusion-vertical-gradient': false
          } }
      ]
    };
  }

  const map = new maplibregl.Map({
    container: 'map',
    style: makeStyle(theme),
    center: MADRID.center,
    zoom: MADRID.zoom,
    pitch: 0,
    maxPitch: 70,
    minZoom: 10.5,
    maxZoom: 19,
    maxBounds: BOUNDS,
    fadeDuration: 0,
    pixelRatio: Math.min(window.devicePixelRatio || 1, 2),  // el iPhone usa 3: con 2 se ve igual de nítido y pesa mucho menos
    attributionControl: false
  });

  map.addControl(new maplibregl.AttributionControl({
    compact: true,
    customAttribution: '<a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a> © <a href="https://www.openmaptiles.org/" target="_blank" rel="noopener">OpenMapTiles</a> Datos de <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'
  }));
  map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');
  map.addControl(new maplibregl.ScaleControl({ unit: 'metric' }), 'bottom-left');

  /* ---------- Inclinación automática según zoom ---------- */
  function targetPitch(z) {
    const t = Math.min(1, Math.max(0, (z - FLAT_UNTIL) / (FULL_3D_AT - FLAT_UNTIL)));
    return t * t * (3 - 2 * t) * MAX_PITCH_AUTO;
  }

  map.on('zoom', () => {
    if (auto) map.setPitch(targetPitch(map.getZoom()));
  });

  const autoBox = document.getElementById('auto');
  map.on('pitchstart', e => {
    if (e.originalEvent && auto) {
      auto = false;
      autoBox.checked = false;
    }
  });
  autoBox.addEventListener('change', () => {
    auto = autoBox.checked;
    if (auto) map.easeTo({ pitch: targetPitch(map.getZoom()), duration: 600 });
  });

  /* ---------- HUD ---------- */
  const modeEl = document.getElementById('mode');
  const statsEl = document.getElementById('stats');
  function updateHud() {
    const z = map.getZoom(), p = map.getPitch();
    const is3d = z >= EXTRUDE_FROM && p > 4;
    modeEl.textContent = is3d ? '3D' : '2D';
    modeEl.classList.toggle('is3d', is3d);
    statsEl.textContent = 'zoom ' + z.toFixed(1) + ' · inclinación ' + Math.round(p) + '°';
  }
  map.on('move', updateHud);
  map.on('load', updateHud);

  /* ---------- Aviso de carga de edificios ---------- */
  const busy = document.getElementById('busy');
  map.on('dataloading', e => {
    if (e.dataType === 'source' && map.getZoom() >= EXTRUDE_FROM - 0.5) busy.classList.add('on');
  });
  map.on('idle', () => busy.classList.remove('on'));

  /* ---------- Lugares ---------- */
  const placesEl = document.getElementById('places');
  PLACES.forEach(pl => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = pl.name;
    b.addEventListener('click', () => {
      map.flyTo({
        center: pl.c, zoom: pl.z, bearing: pl.b,
        pitch: auto ? targetPitch(pl.z) : map.getPitch(),
        speed: 0.9, curve: 1.5, essential: false
      });
    });
    placesEl.appendChild(b);
  });

  document.getElementById('reset').addEventListener('click', () => {
    map.flyTo({ center: MADRID.center, zoom: MADRID.zoom, pitch: 0, bearing: 0, speed: 1, curve: 1.3 });
  });

  /* ---------- Tema ---------- */
  const themeBtn = document.getElementById('theme');
  themeBtn.addEventListener('click', () => {
    theme = theme === 'light' ? 'dark' : 'light';
    document.documentElement.dataset.theme = theme === 'dark' ? 'dark' : '';
    themeBtn.textContent = theme === 'dark' ? 'Modo claro' : 'Modo oscuro';
    map.setStyle(makeStyle(theme));
  });

  /* ---------- Errores de red ---------- */
  const msg = document.getElementById('msg');
  let errors = 0;
  map.on('error', () => {
    errors++;
    if (errors >= 3 && !map.loaded()) {
      msg.style.display = 'block';
      msg.textContent = 'No se pueden cargar los mapas. Comprueba tu conexión.';
    }
  });
  map.on('idle', () => { msg.style.display = 'none'; });

  /* ---------- Caché en el móvil (service worker) ---------- */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
})();
</script>
</body>
</html>
